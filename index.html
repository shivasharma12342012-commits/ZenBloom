<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenBloom | Grow Your Focus</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="heavenly-body font-sans h-screen flex flex-col items-center justify-center relative px-4 overflow-hidden">
    <div class="ambient-layer" aria-hidden="true">
        <span class="sky-orb orb-one"></span>
        <span class="sky-orb orb-two"></span>
        <span class="sky-orb orb-three"></span>
        <span class="light-grain"></span>
    </div>

    <div class="stats-panel">
        <div class="text-center">
            <p class="stat-label">Tokens</p>
            <p id="token-count" class="stat-value">0</p>
        </div>
        <div class="text-center">
            <p class="stat-label">Total Mins</p>
            <p id="minutes-count" class="stat-value">0</p>
        </div>
    </div>

    <div class="main-card text-center max-w-md w-full transition-all duration-300">
        <h1 class="text-4xl font-extrabold mb-1 tracking-tight title-glow">ZenBloom 🌸</h1>
        <p class="subtitle-text text-sm mb-6 font-medium">Grow your focus, starve your distractions.</p>

        <div class="mode-selector grid grid-cols-3 gap-2 p-1 mb-6 text-xs font-bold">
            <button id="mode-study" class="mode-btn mode-btn-active">📚 Study</button>
            <button id="mode-short" class="mode-btn">☕ Break</button>
            <button id="mode-long" class="mode-btn">🛋️ Rest</button>
        </div>

        <div id="plant-stage" class="text-8xl mb-6 transition-all duration-500 ease-in-out hover:scale-110 select-none heavenly-plant">
            🌰
        </div>

        <div class="progress-shell w-full rounded-full h-3.5 mb-6 overflow-hidden">
            <div id="progress-bar" class="h-full rounded-full transition-all ease-linear" style="width: 100%"></div>
        </div>

        <div id="timer-display" class="timer-text text-7xl font-mono font-bold mb-6 tracking-tighter">
            25:00
        </div>

        <div class="space-x-2 mb-6">
            <button id="start-btn" class="primary-btn font-bold py-3.5 px-8 rounded-full transition-all">
                Start Session
            </button>
            <button id="stop-btn" class="secondary-btn font-bold py-3.5 px-6 rounded-full transition-all">
                Reset
            </button>
        </div>

        <div class="checkin-card p-4 rounded-2xl">
            <p class="text-xs font-bold uppercase tracking-wider mb-1 checkin-label">Mindful Check-In</p>
            <p id="motivation-text" class="text-sm italic checkin-text">"An empty tank cannot take you anywhere. Ready to plant your next seed?"</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
